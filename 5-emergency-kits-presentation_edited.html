<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emergency-Kit Distribution: Zoom Presentation</title>
<style>
:root{--bg:#0a1020;--card:#101a2e;--ink:#eaf1ff;--mut:#9aaccb;--teal:#2dd4bf;--blue:#60a5fa;--vio:#a78bfa;--amb:#fbbf24;--cor:#fb7185;--ln:rgba(255,255,255,.09);box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
#vp{position:fixed;inset:0;overflow:hidden;background:radial-gradient(1200px 700px at 50% 40%,#12203d 0,#0a1020 70%)}
#stars{position:absolute;inset:0;background-image:radial-gradient(rgba(147,170,215,.22) 2px,transparent 2.5px);background-size:120px 120px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#path{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;background:radial-gradient(circle at center,transparent 30%,rgba(8,12,26,.92) 100%)}
.frame{position:absolute;width:1280px;height:720px;border-radius:36px;background:linear-gradient(160deg,#14213a,#0e182b);border:2px solid var(--ln);overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.45)}
.frame.mini{cursor:pointer;box-shadow:0 0 0 46px rgba(251,191,36,.3),0 0 140px 60px rgba(251,191,36,.25)}
.frame.mini.on{box-shadow:none;cursor:default}
.h{position:absolute;left:64px;top:34px;right:64px;z-index:2}
.h h2{font-size:52px;line-height:1.1;letter-spacing:-.5px}
.h p{font-size:26px;color:var(--mut);margin-top:8px;transition:color .3s}
.a{opacity:0}
.frame.on .a{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.frame.mini:not(.on) .a{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.g{transform-origin:left center;transform:scaleX(0)}
.frame.on .g{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.frame.mini:not(.on) .g{transform:none}
@keyframes grow{to{transform:scaleX(1)}}
.dr{stroke-dasharray:1;stroke-dashoffset:1}
.frame.on .dr{animation:draw 1.4s ease both;animation-delay:var(--d,0s)}
.frame.mini:not(.on) .dr{stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}
.abs{position:absolute}
.chip{position:absolute;border-radius:22px;background:rgba(255,255,255,.06);border:2px solid var(--ln);padding:20px 26px;font-size:28px;line-height:1.25}
.chip b{color:var(--amb)}
.big{font-weight:800;letter-spacing:-2px}
.pic{position:absolute;border-radius:16px;border:2px solid rgba(255,255,255,.14);box-shadow:0 16px 50px rgba(0,0,0,.5)}
.cov{position:absolute;right:0;top:0;width:640px;height:720px;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%);mask-image:linear-gradient(90deg,transparent 0,#000 38%)}
.frame.on .cov{animation:kb 16s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
/* interactive problem scene */
#p1 .nd{cursor:pointer;transition:opacity .3s}
#p1 .rt{transition:stroke-opacity .35s,stroke-width .35s}
#p1 .lh,#p1 .ls,#p1 .pl,#p1 .bd{opacity:0;transition:opacity .4s;pointer-events:none}
#p1 .pl{stroke-dasharray:16 12;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
#p1btn{position:absolute;right:64px;top:44px;z-index:5;font-size:24px;font-weight:700;color:#0a1020;background:var(--amb);border-radius:999px;padding:12px 26px;cursor:pointer;box-shadow:0 8px 26px rgba(251,191,36,.35);transition:transform .15s}
#p1btn:active{transform:scale(.95)}
/* UI */
#ui{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#ui button{pointer-events:auto;background:rgba(16,26,46,.88);color:var(--ink);border:1.5px solid rgba(255,255,255,.16);border-radius:999px;min-width:46px;height:46px;padding:0 16px;font-size:17px;font-weight:600;backdrop-filter:blur(6px);touch-action:manipulation}
#ui button:active{transform:scale(.94)}
#cnt{pointer-events:none;color:var(--mut);font-size:15px;min-width:64px;text-align:center}
#notes{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:19;max-height:42vh;overflow:auto;background:rgba(10,16,32,.94);border:1.5px solid rgba(255,255,255,.16);border-radius:18px;padding:14px 18px;font-size:18px;line-height:1.7;direction:rtl;text-align:right;display:none;touch-action:pan-y;user-select:text}
#notes.show{display:block}
#notes small{display:block;color:var(--amb);font-size:14px;margin-bottom:4px}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--teal);z-index:20;transition:width .6s}
#hint{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:20;color:var(--mut);font-size:13px;pointer-events:none}
</style>
</head>
<body>
<div id="vp"><div id="stars"></div><div id="world"><svg id="path"></svg></div></div>
<div id="fx"></div>
<div id="bar"></div>
<div id="hint">Tap ▶ · swipe · arrow keys · tap the glowing boxes to zoom in</div>
<div id="notes"></div>
<div id="ui">
  <button id="prev" aria-label="Previous">◀</button>
  <div id="cnt">1 / 17</div>
  <button id="next" aria-label="Next">▶</button>
  <button id="ov" aria-label="Overview">⤢ Zoom out</button>
  <button id="nt" aria-label="Arabic notes">ش شرح</button>
</div>

const NOTES=["الشريحة دي هي الغلاف: عنوان المشروع (تحسين النقل لتوزيع شنط الطوارئ الطبية في مصر)، ومادة بحوث العمليات، وجامعة سفنكس، والجروب OR.9-11.A2.", "المشروع بيحل مشكلة توصيل شنط الطوارئ الطبية من 4 مصانع + مركز مقترح في أسيوط لـ 8 مستشفيات في مصر، بأقل تكلفة نقل. بنستخدم Transportation Model وهو نوع خاص من الـ Linear Programming.", "عندنا 5 مصادر (إجمالي المعروض 116 وحدة) و8 مستشفيات (إجمالي الطلب 106 وحدة). الوحدة = 100 شنطة. بين كل مصدر ومستشفى طريق، يعني 5×8 = 40 طريق محتمل، والمطلوب نختار أرخص خطة شحن. (تلميح: اضغط على أي مصنع أو مستشفى عشان تشوف طرقه، وزر Show optimal plan بيعرض الخطة المثلى.)", "المعروض 116 والطلب 106 يعني المشكلة مش متوازنة. بنضيف وجهة وهمية (Dummy) طلبها 10 وتكلفتها صفر عشان نوازن. الوحدات اللي رايحة للوهمي معناها إنها ما اتشحنتش أصلاً. بعد كده بقى عندنا 45 متغير، و13 خلية أساسية (5+9-1).", "التكلفة كلها اتحسبت بقاعدة واحدة: 2 ثابتة + 0.8 لكل كيلومتر + 1.5 لكل محطة ترحيل (محطة لكل 100 كم). المسافة على الطريق = المسافة المستقيمة × 1.1. لاحظ إن أسوان أغلى وجهة (351 لـ 742)، وأرخص طريقين: Pharco→إسكندرية (26) و Hub→أسيوط (10).", "الحل على 4 مراحل: (1) Least Cost: ناخد أرخص خلية ونشحن أقصى كمية. (2) VAM: بنحسب Penalty = الفرق بين أرخص تكلفتين ونبدأ بأكبر Penalty. (3) MODI: اختبار الأمثلية: u+v=c على الخلايا المستخدمة، وΔ = c-(u+v) على الفاضية؛ لو فيه Δ سالب بنحسّن. (4) التحقق: كل مصدر وطلب متحققين، وسولفر LP مستقل أكد نفس النتيجة.", "ده المحاكي (Simulator) اللي عملناه عشان نشوف الحل بيتنفذ على خريطة مصر. بنختار السيناريو والخوارزمية (Least Cost أو VAM أو MODI)، والعربيات بتتحرك من المصانع للمستشفيات، وسمك الخط بيمثل الكمية. الصورة هنا بتوضح سيناريو توزيع الأدوية وخوارزمية Least Cost في الخطوة 8 من 13.", "المحاكي بيشتغل على أحجام مختلفة: على اليمين السيناريو الصغير (3 مصانع × 4 مستشفيات = 12 طريق) بخوارزمية VAM، وعلى الشمال السيناريو الكبير (8 مصانع × 15 مستشفى = 120 طريق) بخوارزمية Least Cost. نفس الكود بيحل الاتنين وده بيثبت إن الطريقة بتتوسع.", "دي مصفوفة التوزيع جوه المحاكي للسيناريو الكبير. كل خلية فيها تكلفة الوحدة والكمية المشحونة، والخلية الزرقاء هي الخطوة الحالية. لاحظ عمود UNUSED SUPPLY: ده الـ Dummy اللي بيمتص الوحدات الزيادة (69 وحدة) عشان المعروض يساوي الطلب (308).", "دي لوحة التحليلات (Analytics) من المحاكي. أول رسم بيقارن تكلفة كل طريقة: VAM 22,658، وLeast Cost 23,130، وMODI 22,458، وlinprog 22,458. يعني MODI وlinprog وصلوا لنفس الحل الأمثل. الرسم اللي تحت على اليمين بيوضح إن MODI احتاج خطوتين بس. وفيه كمان استخدام المصادر ورضا المستشفيات (كلها 100%).", "LCM طلعت 23,130، وVAM طلعت 22,658، وMODI وصلت للأمثل 22,458 ألف جنيه. VAM أعلى من الأمثل بـ 0.89% بس، وLCM بـ 2.99%، وVAM كسبت LCM بـ 472 ألف. النقطة المهمة: طرق البداية كويسة لكن مش مضمونة، فلازم اختبار الأمثلية MODI. (تلميح: اضغط على المربع الصغير جوه شريط MODI عشان تزوم جواه.)", "من حل VAM، فيه خليتين Δ سالب: Amoun→Tanta (-28) وEIPICO→Tanta (-19). الخطوة 1: دخلنا Amoun→Tanta ونقلنا 2 وحدة فوفرنا 28×2 = 56. الخطوة 2: دخلت VACSERA→Assiut (Δ = -24) ونقلنا 6 وحدات فوفرنا 24×6 = 144. المجموع 200 يعني 22,658 ← 22,458. وبعدها كل Δ ≥ 0 يعني أمثل.", "دي الخطة المثلى: 10 طرق مستخدمة، كل مستشفى بتاخد طلبها بالظبط (106 وحدة) بتكلفة 22,458. سمك الخط = عدد الوحدات. 10 وحدات فاضلين: 6 عند EIPICO و4 عند Pharco. (تلميح: اضغط على المربعين الصغيرين على عقدة Aswan وعقدة Hub.)", "أسوان أغلى وجهة. طريقين أسوان (Amoun→أسوان 10×626 = 6,260 وEIPICO→أسوان 4×628 = 2,512) مجموعهم 8,772 يعني حوالي 39% من التكلفة الكلية، رغم إن الطلب 14 وحدة بس.", "عشان نقيّم مركز أسيوط حلينا المشكلة من غيره: من غير المركز المعروض 98 والطلب 106 فاتضاف مصدر وهمي. النتيجة: التكلفة 22,932 وبيوصل 98 من 106 بس، يعني عجز 8 وحدات في مستشفى أسوان. المركز بيوفر 474 ألف ويمنع العجز، لأنه بيغذي أسيوط بتكلفة 10 بس. تنبيه: ده مقارنة تكلفة نقل بس، مش شامل تكلفة بناء المركز.", "الخلاصة: الخطة المثلى بتكلف 22,458 ألف جنيه وبتوصل كل الـ 106 وحدة. اتوصلنا ليها بـ MODI بعد بداية VAM وأكدها سولفر مستقل. البداية الكويسة بتفيد لكن اختبار الأمثلية هو اللي بيثبت. ومركز أسيوط بيوفر 474 ألف ويمنع عجز 8 وحدات."];

const P1={sel:null,plan:false};
function p1update(){
  const svg=document.getElementById('p1');if(!svg)return;
  const sel=P1.sel,pl=P1.plan;
  svg.querySelectorAll('.rt').forEach(p=>{const i=+p.dataset.i,j=+p.dataset.j;let op=.28,w=2;
    if(pl){op=.04;w=1.5}else if(sel){const m=sel.t==='s'?sel.i===i:sel.i===j;op=m?.95:.05;w=m?4:1.5}
    p.style.strokeOpacity=op;p.style.strokeWidth=w});
  svg.querySelectorAll('.lh').forEach(t=>{t.style.opacity=(!pl&&sel&&sel.t==='s'&&sel.i===+t.dataset.i)?1:0});
  svg.querySelectorAll('.ls').forEach(t=>{const on=!pl&&sel&&sel.t==='h'&&sel.i===+t.dataset.j;t.style.opacity=on?1:0;if(on)t.textContent=cost[+t.dataset.i][+t.dataset.j]});
  svg.querySelectorAll('.pl,.bd').forEach(t=>t.style.opacity=pl?1:0);
  svg.querySelectorAll('.nd').forEach(n=>{const t=n.dataset.t,i=+n.dataset.i;let op=1;
    if(!pl&&sel&&!(sel.t===t&&sel.i===i))op=.45;n.style.opacity=op});
  const b=document.getElementById('p1btn');if(b)b.textContent=pl?'◀ Show all 40 routes':'▶ Show optimal plan';
  const sub=document.getElementById('p1sub');let txt='Tap a source or hospital to light up its routes';
  if(pl)txt='Optimal plan: 10 of 40 routes used · 22,458 thousand EGP · line width = units';
  else if(sel&&sel.t==='s'){const r=cost[sel.i],m=Math.min(...r);txt=`${sources[sel.i][0]}: 8 routes · cheapest unit cost ${m} (${hosp[r.indexOf(m)][0]})`}
  else if(sel){const col=cost.map(r=>r[sel.i]),m=Math.min(...col);txt=`${hosp[sel.i][0]}: 5 routes · cheapest unit cost ${m} (${sources[col.indexOf(m)][0]})`}
  if(sub)sub.textContent=txt;
}
document.addEventListener('click',e=>{
  if(e.target.closest('#p1btn')){P1.plan=!P1.plan;P1.sel=null;p1update();return}
  const n=e.target.closest('#p1 .nd');
  if(n){const t=n.dataset.t,i=+n.dataset.i;P1.plan=false;P1.sel=(P1.sel&&P1.sel.t===t&&P1.sel.i===i)?null:{t,i};p1update();return}
  if(e.target.closest('#p1')&&P1.sel){P1.sel=null;p1update()}
});

function go(b,target,done){
  if(anim)cancelAnimationFrame(anim);
  const a={...cur},dur=Math.min(2800,1600+Math.abs(Math.log(b.s/a.s))*190);
  const sib=target!=null&&idx!=null&&S[idx]&&S[target]&&!(S[target].parent===idx||S[idx].parent===target)&&target!==idx;
  const dist=Math.hypot(b.x-a.x,b.y-a.y);
  const fd=Math.min(innerWidth/(Math.abs(b.x-a.x)+1500),innerHeight/(Math.abs(b.y-a.y)+900));
  const sm=Math.min(fit()*.85,fd*.9);
  const la=Math.log(a.s),lb=Math.log(b.s),B=sib&&dist>1?Math.max(0,(la+lb)/2-Math.log(sm)):0;
  const t0=performance.now();let flagged=false;
  const step=now=>{
    const t=Math.min(1,(now-t0)/dur),e=ease(t);
    cur={x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e,r:a.r+(b.r-a.r)*e,s:Math.exp(la+(lb-la)*e-Math.sin(Math.PI*t)*B)};
    render(cur);
    fx.style.opacity=(Math.sin(Math.PI*t)*Math.min(.9,.25+Math.abs(lb-la)*.12+dist/9000)).toFixed(3);
    if(!flagged&&t>.55){flagged=true;done&&done()}
    if(t<1)anim=requestAnimationFrame(step);else{anim=null;cur=b;render(cur);fx.style.opacity=0}
  };anim=requestAnimationFrame(step);
}
function activate(i){
  S.forEach((f,j)=>f.el.classList.toggle('on',j===i));
  if(i!=null&&S[i])S[i].el.querySelectorAll('[data-count]').forEach(el=>{const n=+el.dataset.count,t0=performance.now();const u=now=>{const p=Math.min(1,(now-t0)/1200);el.textContent=Math.round(n*p);if(p<1)requestAnimationFrame(u)};requestAnimationFrame(u)});
}
function show(i,instant){
  i=Math.max(0,Math.min(S.length-1,i));
  const was=isOv;isOv=false;
  const to=stateOf(S[i]);
  if(instant){if(anim)cancelAnimationFrame(anim);cur=to;render(cur);activate(i);}
  else{S.forEach(f=>f.el.classList.remove('on'));
    const saved=idx;idx=was?null:saved;go(to,i,()=>activate(i));}
  idx=i;ui();
}
function overview(){
  if(isOv){show(idx);return}
  isOv=true;S.forEach(f=>f.el.classList.remove('on'));go(ovState(),null);ui();
}
function ui(){
  document.getElementById('cnt').textContent=isOv?'overview':(idx+1)+' / '+S.length;
  document.getElementById('bar').style.width=((idx+1)/S.length*100)+'%';
  document.getElementById('ov').textContent=isOv?'⤡ Back':'⤢ Zoom out';
  const n=document.getElementById('notes');n.innerHTML='<small>شرح بالمصري</small>'+(isOv?'ده شكل المشروع كله من فوق: كل مرحلة جنب التانية، وبنقرّب على كل واحدة.':NOTES[idx]);
}
document.getElementById('next').onclick=()=>show(isOv?idx:idx+1);
document.getElementById('prev').onclick=()=>show(isOv?idx:idx-1);
document.getElementById('ov').onclick=overview;
document.getElementById('nt').onclick=()=>document.getElementById('notes').classList.toggle('show');
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();show(idx+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}
  else if(e.key==='o'||e.key==='Escape')overview();
  else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1);
});
let sx=null,sy2=null;
vp.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy2=e.touches[0].clientY},{passive:true});
vp.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy2;sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){show(dx<0?idx+1:idx-1)}},{passive:true});
vp.addEventListener('wheel',e=>{e.preventDefault();if(anim)return;show(e.deltaY>0?idx+1:idx-1)},{passive:false});
addEventListener('resize',()=>{cur=isOv?ovState():stateOf(S[idx]);render(cur)});
render(cur);ui();
setTimeout(()=>activate(0),250);
</script>
</body>
</html>
